<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your Name — Portfolio</title>
  <meta name="description" content="Portfolio">
  <meta name="theme-color" content="#EFE9DD" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D1014" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Your Name — Portfolio">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Resolve theme before first paint (no flash). -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("atlas-theme"); } catch (e) {}
      var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (dark ? "dark" : "light"));
      document.documentElement.classList.add("js");
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="grain" aria-hidden="true"></div>

  <!-- Custom crosshair cursor (fine pointers only) -->
  <div class="cursor hidden" aria-hidden="true">
    <div class="cursor-ring"></div>
    <div class="cursor-dot"></div>
    <div class="cursor-label mono"></div>
  </div>

  <!-- ================= Header ================= -->
  <header class="site-header" id="site-header">
    <a class="brand" href="#top" aria-label="Back to top">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="9.5" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1.5 2.5"/>
        <path class="brand-needle" d="M16 4.5l3.2 11.5L16 14l-3.2 2z"/>
        <path d="M16 27.5l-3.2-11.5L16 18l3.2-2z" fill="currentColor" opacity=".35"/>
      </svg>
      <span class="brand-name" data-bind="name"></span>
    </a>

    <nav class="nav" aria-label="Primary">
      <ol class="nav-list" id="nav-list"></ol>
    </nav>

    <div class="header-tools">
      <span class="clock mono" id="clock" title="Local time"></span>
      <button class="tool-btn palette-btn" id="palette-btn" type="button" aria-label="Open command palette" aria-keyshortcuts="Control+K Meta+K">
        <span class="mono">⌘K</span>
      </button>
      <button class="tool-btn theme-btn" id="theme-btn" type="button" aria-label="Switch to dark theme">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <g class="sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g>
          <path class="moon" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
        </svg>
      </button>
      <button class="tool-btn menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <div class="mobile-menu" id="mobile-menu" hidden>
    <ol class="mobile-menu-list" id="mobile-menu-list"></ol>
    <div class="mobile-menu-foot mono" id="mobile-menu-foot"></div>
  </div>

  <!-- Right-edge scroll "sheet index" (desktop) -->
  <aside class="sheet-index" aria-hidden="true">
    <div class="sheet-ruler" id="sheet-ruler"></div>
    <div class="sheet-marker" id="sheet-marker"><span class="mono" id="sheet-pct">000</span></div>
  </aside>

  <!-- ================= Main ================= -->
  <main id="main">
    <section class="hero" id="top" aria-labelledby="hero-name">
      <canvas class="hero-canvas" id="hero-canvas" aria-hidden="true"></canvas>
      <div class="hero-vignette" aria-hidden="true"></div>
      <div class="hero-inner container" id="hero-inner"></div>
    </section>

    <div class="marquee" aria-hidden="true">
      <div class="marquee-track" id="marquee-track"></div>
    </div>

    <section class="section about" id="about" data-section="about"></section>
    <section class="section work" id="work" data-section="work"></section>
    <section class="section route" id="route" data-section="route"></section>
    <section class="section terrain" id="terrain" data-section="terrain"></section>
    <section class="section notes" id="notes" data-section="notes"></section>
    <section class="section contact" id="contact" data-section="contact"></section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <!-- Floating project preview that follows the cursor over the work list -->
  <div class="work-preview" id="work-preview" aria-hidden="true">
    <div class="work-preview-media" id="work-preview-media"></div>
    <span class="work-preview-label mono" id="work-preview-label"></span>
  </div>

  <dialog class="project-dialog" id="project-dialog" aria-labelledby="pd-title"></dialog>

  <dialog class="palette" id="palette" aria-label="Command palette">
    <div class="palette-box">
      <div class="palette-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="palette-input" type="text" placeholder="Where to?" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list">
        <kbd class="mono">esc</kbd>
      </div>
      <ul class="palette-list" id="palette-list" role="listbox" aria-label="Commands"></ul>
      <div class="palette-foot mono">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> go</span>
        <span><kbd>/</kbd> or <kbd>⌘K</kbd> open</span>
        <span><kbd>T</kbd> theme</span>
      </div>
    </div>
  </dialog>

  <div class="toast mono" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">This portfolio renders its content with JavaScript. Please enable it to explore the map.</div>
  </noscript>

  <!-- Latest posts are inlined here by build.py; ignored when the file is opened directly. -->
  <!-- build:notes -->
  <script src="js/content.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
