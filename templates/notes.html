<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  {{ robots }}
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ description }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ description }}">
  {{ canonical }}
  <link rel="alternate" type="application/atom+xml" title="Field Notes" href="{{ root }}feed.xml">
  <link rel="icon" href="{{ root }}favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("atlas-theme"); } catch (e) {}
      var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (dark ? "dark" : "light"));
      document.documentElement.classList.add("js");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ root }}css/style.css">
  <link rel="stylesheet" href="{{ root }}css/notes.css">
  <script defer src="{{ root }}js/notes.js"></script>
</head>
<body class="notes-page archive-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="grain" aria-hidden="true"></div>
  {{ staging_banner }}
  {{ header }}

  <main id="main" class="container archive">
    <header class="sec-head">
      <div class="sec-meta mono">
        <span class="sec-idx">05</span><span>Writing &amp; lab</span>
        <span class="sec-rule" aria-hidden="true"></span>
        <span class="sec-coord" aria-hidden="true">{{ coords }}</span>
      </div>
      <div class="sec-head-row has-intro">
        <h1 class="sec-title">Field <em>Notes</em></h1>
        <p class="sec-intro">Stories from the work, algorithms worth explaining, and the occasional flex.
          <span class="archive-count mono">{{ count }} entries · <a href="{{ root }}feed.xml">RSS</a></span></p>
      </div>
    </header>

    {{ filters }}
    <div class="logbook">{{ years }}</div>
    {{ empty }}
  </main>

  {{ footer }}
</body>
</html>
