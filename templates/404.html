<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Off the map — {{ name }}</title>
  <link rel="icon" href="{{ root }}favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("atlas-theme"); } catch (e) {}
      var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (dark ? "dark" : "light"));
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ root }}css/style.css">
  <link rel="stylesheet" href="{{ root }}css/notes.css">
  <script defer src="{{ root }}js/notes.js"></script>
</head>
<body class="notes-page lost-page">
  {{ staging_banner }}
  {{ header }}
  <main id="main" class="lost container">
    <p class="mono lost-code"><span class="accent">404</span> — coordinates not found</p>
    <h1 class="lost-title">Off the <em>map</em>.</h1>
    <p class="lost-text">This spot isn't on any sheet. The trail may have moved, or it was never charted.</p>
    <div class="lost-actions">
      <a class="btn btn-primary" href="{{ root }}">Back to the portfolio <span class="arrow" aria-hidden="true">→</span></a>
      <a class="btn btn-ghost" href="{{ root }}notes/">Field Notes</a>
    </div>
  </main>
</body>
</html>
