<header class="site-header notes-header" id="site-header">
    <a class="brand" href="{{ root }}" aria-label="{{ name }} — portfolio home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="9.5" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1.5 2.5"/>
        <path class="brand-needle" d="M16 4.5l3.2 11.5L16 14l-3.2 2z"/>
        <path d="M16 27.5l-3.2-11.5L16 18l3.2-2z" fill="currentColor" opacity=".35"/>
      </svg>
      <span class="brand-name">{{ name }}</span>
    </a>
    <nav class="crumbs mono" aria-label="Breadcrumb">
      <a href="{{ root }}">Sheet 01</a><span aria-hidden="true">/</span><a href="{{ root }}notes/">Field Notes</a>
    </nav>
    <div class="header-tools">
      <a class="tool-btn feed-btn" href="{{ root }}feed.xml" aria-label="Subscribe via RSS"><span class="mono">RSS</span></a>
      <button class="tool-btn theme-btn" id="theme-btn" type="button" aria-label="Switch to dark theme">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <g class="sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g>
          <path class="moon" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
        </svg>
      </button>
    </div>
  </header>
