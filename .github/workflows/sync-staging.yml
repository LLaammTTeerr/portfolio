# Keeps `staging` up to date with `main` on a schedule: merges main into
# staging, then triggers a staging deploy if anything changed.
#
# Write drafts on `staging` and merge staging → main (via a pull request) to
# publish. This job carries anything that landed on main directly (fixes,
# design changes) back into staging, so staging never drifts behind production.
#
# If the merge conflicts, the job fails (GitHub emails you) and staging is left
# untouched. Resolve it locally:  git checkout staging && git merge main
name: Sync main → staging

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours, at :17 to avoid the top-of-hour rush
  workflow_dispatch:

permissions:
  contents: write   # push the merge to staging
  actions: write    # dispatch staging.yml

concurrency:
  group: sync-staging
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Merge main into staging
        id: merge
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "staging already contains main, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit -m "Sync main into staging" origin/main; then
            git merge --abort
            echo "::error::main and staging conflict. Merge them locally: git checkout staging && git merge main"
            exit 1
          fi
          git push origin HEAD:staging
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy staging
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run staging.yml --ref staging --repo "$GITHUB_REPOSITORY"
